{{template "vendor/partials/header.html" .}}

{{/* Stratus Design System */}}
<div class="max-w-md mx-auto bg-white dark:bg-dark-grey-900 rounded-lg shadow-md border border-cool-grey-300 dark:border-dark-grey-500 p-6 mt-10">
  <h2 class="text-2xl font-bold mb-6 text-center text-cool-grey-900 dark:text-white">{{.Title}}</h2>

  <form id="loginForm" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium text-cool-grey-700 dark:text-cool-grey-300"
        >Email</label
      >
      <input
        type="email"
        id="email"
        name="email"
        required
        class="mt-1 block w-full px-3 py-2 border border-cool-grey-300 dark:border-dark-grey-500 dark:bg-dark-grey-800 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-primary-600"
        placeholder="Enter your email"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-primary-600 text-white py-2 px-4 rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500"
    >
      {{.ButtonText}}
    </button>
  </form>

  {{if .HelpText}}
  <p class="mt-4 text-sm text-cool-grey-600 dark:text-cool-grey-400 text-center">{{.HelpText}}</p>
  {{end}}

  <div
    id="error"
    class="mt-4 p-3 bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-800 text-red-700 dark:text-red-300 rounded hidden"
  ></div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const errorDiv = document.getElementById("error");

    try {
      const response = await fetch("{{.BasePath}}/login/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ email }),
      });

      const data = await response.json();

      if (response.ok) {
        // Set the token in a cookie instead of localStorage
        document.cookie = "jwt=" + encodeURIComponent(data.token) + "; path=/";
        window.location.href = "{{.RedirectURL}}";
      } else {
        errorDiv.textContent = data.message || "Login failed";
        errorDiv.classList.remove("hidden");
      }
    } catch (error) {
      errorDiv.textContent = "Network error. Please try again.";
      errorDiv.classList.remove("hidden");
    }
  });
</script>

{{template "vendor/partials/footer.html" .}}
