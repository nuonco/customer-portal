        </main>
    {{/* Stratus Design System */}}
    {{if .SupportContact}}
    <footer class="border-t border-cool-grey-200 dark:border-dark-grey-600 mt-8 py-4">
      <div class="container mx-auto text-center text-sm text-cool-grey-600 dark:text-cool-grey-400">
        Need help? Contact
        {{if contains .SupportContact "@"}}
        <a href="mailto:{{.SupportContact}}" class="{{if .SecondaryColor}}text-theme-secondary hover:text-theme-secondary-hover{{else}}text-primary-600 hover:text-primary-800{{end}}">{{.SupportContact}}</a>
        {{else}}
        <a href="{{.SupportContact}}" target="_blank" class="{{if .SecondaryColor}}text-theme-secondary hover:text-theme-secondary-hover{{else}}text-primary-600 hover:text-primary-800{{end}}">support</a>
        {{end}}
      </div>
    </footer>
    {{end}}
    <script>
      // Helper function to get cookie value
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }

      // Add JWT token to requests if available
      const token = getCookie("jwt");

      if (token) {
        // Set default Authorization header for fetch requests
        const originalFetch = window.fetch;
        window.fetch = function (url, options = {}) {
          if (!options.headers) {
            options.headers = {};
          }
          options.headers["Authorization"] = "Bearer " + token;
          return originalFetch(url, options);
        };
      }
    </script>
  </body>
</html>
