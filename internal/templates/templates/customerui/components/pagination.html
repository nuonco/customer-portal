{{ define "pagination" }}
<nav class="flex items-center justify-between mt-6 px-4 py-3 bg-white dark:bg-dark-grey-800 border border-cool-grey-200 dark:border-dark-grey-600 rounded-lg">
    <!-- Mobile pagination -->
    <div class="flex-1 flex justify-between sm:hidden">
        {{ if .HasPrevious }}
            <a href="{{ .BaseURL }}{{ .PreviousPage }}" class="relative inline-flex items-center px-4 py-2 text-sm font-medium text-cool-grey-700 dark:text-cool-grey-300 bg-white dark:bg-dark-grey-800 border border-cool-grey-300 dark:border-dark-grey-600 rounded-md hover:bg-cool-grey-50 dark:hover:bg-dark-grey-700">
                Previous
            </a>
        {{ end }}
        {{ if .HasNext }}
            <a href="{{ .BaseURL }}{{ .NextPage }}" class="relative ml-3 inline-flex items-center px-4 py-2 text-sm font-medium text-cool-grey-700 dark:text-cool-grey-300 bg-white dark:bg-dark-grey-800 border border-cool-grey-300 dark:border-dark-grey-600 rounded-md hover:bg-cool-grey-50 dark:hover:bg-dark-grey-700">
                Next
            </a>
        {{ end }}
    </div>
    <!-- Desktop pagination -->
    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
        <div>
            <p class="text-sm text-cool-grey-700 dark:text-cool-grey-300">
                Page <span class="font-medium">{{ .CurrentPage }}</span> of <span class="font-medium">{{ .TotalPages }}</span>
            </p>
        </div>
        <div>
            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                {{ if .HasPrevious }}
                    <a href="{{ .BaseURL }}{{ .PreviousPage }}" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-cool-grey-300 dark:border-dark-grey-600 bg-white dark:bg-dark-grey-800 text-sm font-medium text-cool-grey-500 dark:text-cool-grey-400 hover:bg-cool-grey-50 dark:hover:bg-dark-grey-700">
                        <span class="sr-only">Previous</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                    </a>
                {{ else }}
                    <span class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-cool-grey-300 dark:border-dark-grey-600 bg-cool-grey-100 dark:bg-dark-grey-700 text-sm font-medium text-cool-grey-400 dark:text-cool-grey-500 cursor-not-allowed">
                        <span class="sr-only">Previous</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                    </span>
                {{ end }}
                {{ if .HasNext }}
                    <a href="{{ .BaseURL }}{{ .NextPage }}" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-cool-grey-300 dark:border-dark-grey-600 bg-white dark:bg-dark-grey-800 text-sm font-medium text-cool-grey-500 dark:text-cool-grey-400 hover:bg-cool-grey-50 dark:hover:bg-dark-grey-700">
                        <span class="sr-only">Next</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                        </svg>
                    </a>
                {{ else }}
                    <span class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-cool-grey-300 dark:border-dark-grey-600 bg-cool-grey-100 dark:bg-dark-grey-700 text-sm font-medium text-cool-grey-400 dark:text-cool-grey-500 cursor-not-allowed">
                        <span class="sr-only">Next</span>
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                        </svg>
                    </span>
                {{ end }}
            </nav>
        </div>
    </div>
</nav>
{{ end }}
