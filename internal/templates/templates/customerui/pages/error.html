{{ define "customer-error" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="{{ default .CSSPath "/static/css/customer.css" }}" rel="stylesheet">
    {{ template "login-dark-mode-script" }}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {{ if .Theme }}{{ themeCSS .Theme }}{{ end }}
</head>
<body class="bg-cool-grey-50 dark:bg-dark-grey-950 dark:text-white min-h-screen flex items-center justify-center">
    <div class="max-w-md mx-auto text-center p-6">
        <div class="mx-auto flex items-center justify-center h-16 w-16 mb-6 rounded-full bg-red-100 dark:bg-red-900/30">
            <svg class="h-8 w-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-cool-grey-900 dark:text-white mb-4">Something went wrong</h1>
        <p class="text-cool-grey-600 dark:text-cool-grey-400 mb-6">{{ default .Error "An unexpected error occurred. Please try again later." }}</p>
        <a href="{{ .BasePath }}/" class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-theme-primary hover:bg-theme-primary-hover rounded-md">
            Go back home
        </a>
    </div>
</body>
</html>
{{ end }}
