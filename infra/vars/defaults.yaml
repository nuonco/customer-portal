---
use_root_domain: false
subdomain: customers
region: us-west-2
pool: nuon
rds:
  engine: postgres
  # Both stage and prod instances are on 15.17: auto_minor_version_upgrade is
  # enabled in the module, so AWS upgraded them during a maintenance window while
  # this stayed pinned at 15.12. Terraform then tried to downgrade on every apply
  # and RDS rejected it ("Cannot find upgrade path from 15.17 to 15.12").
  engine_version: "15.17"
  family: "postgres15"
  parameters:
    - name: max_connections
      value: 200
      apply_method: pending-reboot
    - name: tcp_keepalives_idle
      value: 10
    - name: tcp_keepalives_count
      value: 3
  major_engine_version: "15"
  instance_class: "db.t4g.small"
  allocated_storage: "20"
  db_name: customer_dashboard
  port: 5432
  username: nuonadmin
  multi_az: false
  backup_retention_period: 1
  skip_final_snapshot: true
  deletion_protection: true
  storage_encrypted: true
  enabled_cloudwatch_logs_exports:
    - postgresql
    - upgrade
