# Docker Compose configuration for customer-dashboard integration tests
# Provides isolated test infrastructure (PostgreSQL) for running integration tests

version: "3.8"

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: customer-dashboard-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: customer_dashboard_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d customer_dashboard_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    tmpfs:
      # Use tmpfs for faster test database operations
      - /var/lib/postgresql/data
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  test-postgres-data:
