---
type: service

base_images:
  - src: Dockerfile.build
    name: BUILD_IMAGE
    tag: buildimage
  - src: Dockerfile.runtime
    name: RUNTIME_IMAGE
    tag: runtimeimage

sources:
  - src: go.mod
  - src: go.sum
  - src: tools.go
  - src: images/go-base/Dockerfile.build
    dst: Dockerfile.build
  - src: images/go-base/Dockerfile-awsauth-cacert.runtime
    dst: Dockerfile.runtime
  - src: .golangci.yml

tests:
  - name: lint
    docker_target: lint

color: green

health_checks:
  # All three run inside the single dev.sh command (local_cmds[0]), so they are
  # grouped under one nested list (same shape as dashboard-ui): Go server,
  # Vite client, and Ladle.
  - - http://localhost:8080/livez
    - http://localhost:51273
    - http://localhost:61001

env:
  PORT: 8080
  GIN_MODE: debug

  # Database config for local PostgreSQL
  DATABASE_URL: postgres://customer_dashboard:password@localhost:5432/customer_dashboard?sslmode=disable

  # Nuon API
  NUON_API_URL: http://localhost:8081

  # Customer base URL for install links
  CUSTOMER_BASE_URL: http://localhost:8080
  SUBDOMAIN_BASE_DOMAIN: localhost:8080

  # Auth config for OIDC (using stage credentials for local dev)
  AUTH_PROVIDER: oidc
  AUTH_CLIENT_ID: "457475541946-uar9phtln2tsth04t64kdscetel2l2cs.apps.googleusercontent.com"
  AUTH_OIDC_ISSUER_URL: "https://accounts.google.com"
  AUTH_REDIRECT_URI: http://localhost:8080/admin/callback
  AUTH_CLIENT_SECRET: "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"

  SERVICE_TYPE: app
  SERVICE_DEPLOYMENT: customer-dashboard
  DISABLE_METRICS: true
  SUPERUSER_EMAIL_DOMAIN: nuon.co
  LIVE_RELOAD: "true"
  TEMPL_DEV_MODE_ROOT: ./tmp/templ-dev

watch_ignore:
  - /tmp/*
  - /static/*
  - _templ.go
  # The React client under ui/ has its own Vite HMR; keep it out of the Go
  # watcher so editing .tsx does not trigger a Go rebuild + Vite restart.
  - /ui/

local_startup_cmds:

local_build_cmds:
  - ./scripts/build-css.sh
  - go tool templ generate --lazy ./...
  - go build -o ./tmp/main .

local_cmds:
  # Single entry (like dashboard-ui's dev.sh): runs the Go server (./tmp/main)
  # and the React/Vite client (bun run dev:all) together under one process
  # group, so you never start bun by hand. Go rebuilds are handled by
  # local_build_cmds via nuonctl's file watcher.
  - ./scripts/dev.sh

docker_cmds:
  - cmd: ""
    ports:
      - 8080

namespace: customer-dashboard

docker_env:
  AUTH_CLIENT_SECRET: "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"
  SUPERUSER_EMAIL_DOMAIN: nuon.co
  DATABASE_URL: postgres://customer_dashboard:password@host.nuon.dev:5432/customer_dashboard?sslmode=disable
  NUON_API_URL: http://host.nuon.dev:8081
  CUSTOMER_BASE_URL: http://localhost:8080
  AUTH_REDIRECT_URI: http://localhost:8080/admin/callback
  SERVICE_TYPE: app
  SERVICE_DEPLOYMENT: customer-dashboard

  AUTH_PROVIDER: oidc
  AUTH_CLIENT_ID: "457475541946-uar9phtln2tsth04t64kdscetel2l2cs.apps.googleusercontent.com"
  AUTH_OIDC_ISSUER_URL: "https://accounts.google.com"
  AUTH_REDIRECT_URI: http://localhost:8080/admin/callback
  AUTH_CLIENT_SECRET: "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"
