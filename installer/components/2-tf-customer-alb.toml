#:schema https://api.nuon.co/v1/general/config-schema?source=terraform
name              = "customer_alb"
type              = "terraform_module"
terraform_version = "1.13.5"

[connected_repo]
repo      = "powertoolsdev/mono"
directory = "exp/installer/app/installer/src/alb"
branch    = "ja/installer-v2"

[vars]
region          = "{{.nuon.install_stack.outputs.region}}"
vpc_id          = "{{.nuon.install_stack.outputs.vpc_id}}"
nuon_id         = "{{.nuon.install.id}}"
certificate_arn = "{{.nuon.components.customer_certificate.outputs.arn}}"
zone_id         = "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.zone_id}}"
domain_name     = "{{.nuon.inputs.inputs.customer_subdomain}}.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
internal        = "false"
container_port      = "8080"
alb_name            = "cst"
block_admin_paths   = "true"
