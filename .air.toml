# Air configuration for live reloading
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
# Build command - run templ generate before go build
cmd = "./scripts/build.sh"
# Binary to run
bin = "./tmp/main"
# Watch these file extensions (including .templ for incremental migration)
include_ext = ["go", "html", "css", "templ"]
# Exclude these directories from watching
exclude_dir = ["tmp", "bin", "static", "node_modules", "vendor"]
# Exclude files matching these patterns (generated _templ.go files)
exclude_regex = ["_test\\.go$", "_templ\\.go$"]
# Delay before rebuilding (ms)
delay = 1000
# Stop old binary before building new one
stop_on_error = true
# Send interrupt signal before killing
send_interrupt = true
# Delay after interrupt before kill (ms)
kill_delay = 500

[log]
# Show build time
time = true
# Show only main log (not file change events)
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true

[proxy]
# Enable proxy mode for browser live reload
enabled = true
# Port for the proxy server (access this in your browser)
proxy_port = 3000
# Port your Go app listens on
app_port = 8080
